name: 에코 트레킹 Android 시연 빌드
on:
  push:
    branches: [development/v3]
    paths:
      - android/gnss-assist/**
      - .github/workflows/eco-trekking-android.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: SDK 35 준비
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: 계측 및 시연 APK 빌드
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          key="$RUNNER_TEMP/eco-trekking-demo.keystore"
          python3 android/gnss-assist/tools/build.py --sdk "$ANDROID_HOME" --keystore "$key"
          python3 android/gnss-assist/tools/build.py --sdk "$ANDROID_HOME" --keystore "$key" --demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Eco-Trekking-BLE-Demo
          path: android/gnss-assist/build/demo/Eco-Trekking-BLE-Demo.apk
          if-no-files-found: error
