name: supabase-auth-app-test
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_PASSWORD: local-test-only-password
    volumes: ["./db-init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:58025:8025"]
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    ports: ["127.0.0.1:55999:9999"]
    healthcheck:
      test: [CMD, wget, -q, --spider, -T, "2", -Y, "off", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:55821
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3000/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:local-test-only-password@db:5432/postgres?sslmode=disable
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: local-test-only-jwt-secret-at-least-32-characters
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@example.test
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: 로컬 인증 테스트
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
